[package]
name = "tui-view"
version = "0.1.0"
edition = "2021"
description = "A ratatui widget library for pluggable text file format views"
license = "MIT OR Apache-2.0"
repository = ""
keywords = ["ratatui", "tui", "widget", "viewer", "markdown"]
categories = ["command-line-interface", "text-processing"]

[features]
default = ["markdown", "json", "plaintext", "hex"]
markdown = ["dep:pulldown-cmark"]
json = ["dep:serde_json"]
plaintext = []
hex = []
# The Tree-sitter view itself, with no grammars. Enable one `lang-*` feature
# per language you want highlighted; each pulls in a C grammar, so they are
# opt-in and off by default.
treesitter = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
lang-rust = ["treesitter", "dep:tree-sitter-rust"]
lang-python = ["treesitter", "dep:tree-sitter-python"]
lang-javascript = ["treesitter", "dep:tree-sitter-javascript"]
lang-typescript = ["treesitter", "dep:tree-sitter-typescript", "lang-javascript"]
lang-go = ["treesitter", "dep:tree-sitter-go"]
lang-c = ["treesitter", "dep:tree-sitter-c"]
lang-bash = ["treesitter", "dep:tree-sitter-bash"]
lang-toml = ["treesitter", "dep:tree-sitter-toml-ng"]
lang-yaml = ["treesitter", "dep:tree-sitter-yaml"]
lang-html = ["treesitter", "dep:tree-sitter-html"]
lang-css = ["treesitter", "dep:tree-sitter-css"]
# Every bundled grammar.
languages = [
    "lang-rust",
    "lang-python",
    "lang-javascript",
    "lang-typescript",
    "lang-go",
    "lang-c",
    "lang-bash",
    "lang-toml",
    "lang-yaml",
    "lang-html",
    "lang-css",
]

[dependencies]
ratatui = "0.30"
pulldown-cmark = { version = "0.12", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
tree-sitter = { version = "0.26.12", optional = true }
tree-sitter-highlight = { version = "0.26.12", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
